[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast"
version = "0.1.0"
description = "A single-rotor UAV that steers by moving its own centre of gravity"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["uav", "drone", "robotics", "flight-control", "multibody-dynamics",
            "moving-mass", "aerospace", "simulation", "control-theory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
ballast = "ballast.cli:main"

[project.urls]
Homepage = "https://github.com/Omammadlidev/ballast"
Issues = "https://github.com/Omammadlidev/ballast/issues"

[tool.setuptools.packages.find]
include = ["ballast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
